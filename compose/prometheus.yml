# Prometheus scrape config for the aigw TrueNAS app.
# The gateway runs in the same compose network as this service, so scrape it by its
# service name (internal — no host port involved). Rules: the SLO + burn-rate alerts
# in rules.yaml, mounted at /etc/prometheus/rules/rules.yaml by the compose file.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/rules.yaml

scrape_configs:
  - job_name: aigw
    static_configs:
      - targets: ["gateway:8080"]
